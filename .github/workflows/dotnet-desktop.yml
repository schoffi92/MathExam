# Builds and tests MathExam on every push and pull request to main.
# package_linux.sh runs the tests, publishes the self-contained Windows and Linux builds
# (build_release.sh) and creates the Linux archive; both builds are kept as run artifacts.
# Pushing a version tag (e.g. v0.2) also attaches them to a GitHub release for that tag.

name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Either OS can publish both platforms; Linux is needed for the archive's file permissions.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # global.json requires SDK 9.0.300+ (Avalonia 12's source generators); the app targets net8.0.
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Test, publish and package
      run: bash ./package_linux.sh

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: MathExam-win-x64
        path: release/win-x64/MathExam.exe
        if-no-files-found: error

    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: MathExam-linux-x64
        path: release/MathExam-linux-x64.tar.gz
        if-no-files-found: error

    - name: Attach builds to the release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/win-x64/MathExam.exe
          release/MathExam-linux-x64.tar.gz

permissions:
  contents: write  # only needed by the release step
